<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Modern-normalize -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@700&family=Poppins:wght@400;500;600&family=Roboto:wght@400&display=swap"
      rel="stylesheet" />

    <title>BWA - Gear (Community)</title>

    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="container header__container">
        <!-- logotype -->
        <a class="header__logo link" href="./">
          <img
            src="./images/logo.png"
            srcset="./images/logo@2x.png 2x"
            alt="Gear Tools logo"
            width="40" />
        </a>

        <!-- navigation -->
        <nav class="header__nav" aria-label="Main navigation">
          <ul class="header__list list">
            <li class="header__item">
              <a class="header__link link" href="./index.html">Home</a>
            </li>
            <li class="header__item">
              <a class="header__link link" href="./popular.html">Popular</a>
            </li>
            <li class="header__item">
              <a class="header__link link" href="./newcomer.html">Newcomer</a>
            </li>
            <li class="header__item">
              <a class="header__link link" href="./about.html">About</a>
            </li>
          </ul>
        </nav>

        <!-- login -->
        <a class="login header__login link" href="#">Login</a>

        <!-- burger menu -->
        <button
          class="header__burger js-open-menu"
          type="button"
          aria-label="Open main navigation">
          <svg
            class="header__burger-icon"
            width="25"
            height="21"
            aria-hidden="true">
            <use href="./images/sprite.svg#icon-burger"></use>
          </svg>
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
      <!-- Hero section -->
      <section class="hero">
        <div class="container hero__container">
          <!-- brands -->
          <div class="hero__brands">
            <!-- circle of brands -->
            <div class="hero__circle-brands">
              <!-- decorative circle -->
              <img
                class="hero__circle-icon"
                src="./images/hero/circle.svg"
                width="315"
                aria-hidden="true" />

              <!-- Gear icon -->
              <img
                class="hero__gear"
                src="./images/hero/gear.png"
                srcset="./images/hero/gear@2x.png 2x"
                width="100"
                alt="Gear decorative icon" />

              <!-- Figma icon -->
              <div class="gray-circle hero__figma">
                <img
                  class="hero__figma-icon"
                  src="./images/hero/figma.svg"
                  alt="Figma icon" />
              </div>

              <!-- InVision icon -->
              <div class="gray-circle hero__invision">
                <img
                  class="hero__invision-icon"
                  src="./images/hero/invision.svg"
                  alt="InVision icon" />
              </div>

              <!-- Github icon -->
              <div class="gray-circle hero__github">
                <img
                  class="hero__github-icon"
                  src="./images/hero/github.svg"
                  alt="Github icon" />
              </div>

              <!-- Adobe XD icon -->
              <div class="gray-circle hero__adobe">
                <img
                  class="hero__adobe-icon"
                  src="./images/hero/adobe-xd.svg"
                  alt="Adobe XD icon" />
              </div>

              <!-- VS Code icon -->
              <div class="gray-circle hero__vscode">
                <img
                  class="hero__vscode-icon"
                  src="./images/hero/vs-code.svg"
                  alt="VS Code icon" />
              </div>

              <!-- PyCharm icon -->
              <div class="gray-circle hero__pycharm">
                <img
                  class="hero__pycharm-icon"
                  src="./images/hero/pycharm.svg"
                  alt="PyCharm icon" />
              </div>
            </div>
          </div>

          <!-- content -->
          <div class="hero__content">
            <h1 class="hero__title">
              Tools for Designer, Developer, and Business Owner
            </h1>

            <p class="hero__description">
              Information about the latest and most popular design and developer
              tools around the world.
            </p>

            <a class="hero__link link" href="#">Explore now</a>

            <div class="hero__stats">
              <!-- list avatars -->
              <ul class="hero__list-avatars list">
                <li class="hero__avatar">
                  <img
                    src="./images/hero/user1.png"
                    srcset="./images/hero/user1@2x.png 2x"
                    width="50"
                    alt="User avatar - Oliver" />
                </li>
                <li class="hero__avatar">
                  <img
                    src="./images/hero/user2.png"
                    srcset="./images/hero/user2@2x.png 2x"
                    width="50"
                    alt="User avatar - Jacob" />
                </li>
              </ul>

              <p class="hero__usage">
                <span class="hero__usage-number">4,000+</span> Users using the
                tools
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- MOBILE MENU -->
    <div class="menu js-menu-container" id="mobile-menu">
      <div class="container menu__container">
        <!-- header menu -->
        <div class="menu__header">
          <!-- logotype -->
          <a class="menu__logo link" href="./index.html">
            <img
              src="./images/logo.png"
              srcset="./images/logo@2x.png 2x"
              alt="Gear Tools logo"
              width="40" />
          </a>

          <!-- close button -->
          <button
            class="menu__close js-close-menu"
            type="button"
            aria-label="Close main navigation">
            <svg
              class="menu__close-icon"
              width="20"
              height="20"
              aria-hidden="false">
              <use href="./images/sprite.svg#icon-close"></use>
            </svg>
          </button>
        </div>

        <!-- main content -->
        <div class="menu__main">
          <!-- navigation -->
          <nav class="menu__nav" aria-label="Main navigation">
            <ul class="menu__list list">
              <li class="menu__item">
                <a class="menu__link link" href="./index.html">Home</a>
              </li>
              <li class="menu__item">
                <a class="menu__link link" href="./popular.html">Popular</a>
              </li>
              <li class="menu__item">
                <a class="menu__link link" href="./newcomer.html">Newcomer</a>
              </li>
              <li class="menu__item">
                <a class="menu__link link" href="./about.html">About</a>
              </li>
            </ul>
          </nav>
          <!-- login -->
          <a class="login menu__login link" href="#">Login</a>
        </div>
      </div>
    </div>

    <script src="./js/mobile-menu.js"></script>
    <script src="./js/current-page.js"></script>
  </body>
</html>
