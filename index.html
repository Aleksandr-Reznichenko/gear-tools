<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Modern-normalize -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@700&family=Poppins:wght@400;500;600&family=Roboto:wght@400&display=swap"
      rel="stylesheet" />

    <title>BWA - Gear (Community)</title>

    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="container header__container">
        <!-- logotype -->
        <a class="header__logo link" href="./index.html">
          <img
            src="./images/logo.png"
            srcset="./images/logo@2x.png 2x"
            alt="Gear Tools logo"
            width="40" />
        </a>

        <!-- navigation -->
        <nav class="header__nav" aria-label="Main navigation">
          <ul class="header__list list">
            <li class="header__item">
              <a
                class="header__link header__link--current link"
                href="./index.html"
                aria-current="page">
                Home
              </a>
            </li>
            <li class="header__item">
              <a class="header__link link" href="#">Popular</a>
            </li>
            <li class="header__item">
              <a class="header__link link" href="#">Newcomer</a>
            </li>
            <li class="header__item">
              <a class="header__link link" href="#">About</a>
            </li>
          </ul>
        </nav>

        <!-- login -->
        <a class="login header__login link" href="#">Login</a>

        <!-- burger menu -->
        <button
          class="header__burger"
          type="button"
          aria-label="Open main navigation">
          <svg
            class="header__burger-icon"
            width="25"
            height="21"
            aria-hidden="true">
            <use href="./images/sprite.svg#icon-burger"></use>
          </svg>
        </button>
      </div>
    </header>
  </body>
</html>
