<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Modern-normalize -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@700&family=Poppins:wght@400;500;600&family=Roboto:wght@400&display=swap"
      rel="stylesheet" />

    <title>BWA - Gear (Community)</title>

    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="container header__container">
        <!-- logotype -->
        <a class="header__logo link" href="./">
          <img
            src="./images/logo.png"
            srcset="./images/logo@2x.png 2x"
            alt="Gear Tools logo"
            width="40" />
        </a>

        <!-- navigation -->
        <nav class="header__nav" aria-label="Main navigation">
          <ul class="header__list list">
            <li class="header__item">
              <a class="header__link link" href="./index.html">Home</a>
            </li>
            <li class="header__item">
              <a class="header__link link" href="./popular.html">Popular</a>
            </li>
            <li class="header__item">
              <a class="header__link link" href="./newcomer.html">Newcomer</a>
            </li>
            <li class="header__item">
              <a class="header__link link" href="./about.html">About</a>
            </li>
          </ul>
        </nav>

        <!-- login -->
        <a class="login header__login link" href="#">Login</a>

        <!-- burger menu -->
        <button
          class="header__burger js-open-menu"
          type="button"
          aria-label="Open main navigation">
          <svg
            class="header__burger-icon"
            width="25"
            height="21"
            aria-hidden="true">
            <use href="./images/sprite.svg#icon-burger"></use>
          </svg>
        </button>
      </div>
    </header>

    <!-- MOBILE MENU -->
    <div class="menu js-menu-container" id="mobile-menu">
      <div class="container menu__container">
        <!-- header menu -->
        <div class="menu__header">
          <!-- logotype -->
          <a class="menu__logo link" href="./index.html">
            <img
              src="./images/logo.png"
              srcset="./images/logo@2x.png 2x"
              alt="Gear Tools logo"
              width="40" />
          </a>

          <!-- close button -->
          <button
            class="menu__close js-close-menu"
            type="button"
            aria-label="Close main navigation">
            <svg
              class="menu__close-icon"
              width="20"
              height="20"
              aria-hidden="false">
              <use href="./images/sprite.svg#icon-close"></use>
            </svg>
          </button>
        </div>

        <!-- main content -->
        <div class="menu__main">
          <!-- navigation -->
          <nav class="menu__nav" aria-label="Main navigation">
            <ul class="menu__list list">
              <li class="menu__item">
                <a class="menu__link link" href="./index.html">Home</a>
              </li>
              <li class="menu__item">
                <a class="menu__link link" href="./popular.html">Popular</a>
              </li>
              <li class="menu__item">
                <a class="menu__link link" href="./newcomer.html">Newcomer</a>
              </li>
              <li class="menu__item">
                <a class="menu__link link" href="./about.html">About</a>
              </li>
            </ul>
          </nav>
          <!-- login -->
          <a class="login menu__login link" href="#">Login</a>
        </div>
      </div>
    </div>

    <script src="./js/mobile-menu.js"></script>
    <script src="./js/current-page.js"></script>
  </body>
</html>
